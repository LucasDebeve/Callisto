savoir: prem-py-variables
questions:
  - code: prem-var-q1
    type: unique
    enonce: Qu'affiche ce programme ?
    code_source: |
      a = 3
      b = a
      a = 5
      print(b)
    choix:
      - texte: "3"
        juste: true
      - texte: "5"
    explication: b reçoit la valeur de a au moment de l'affectation, soit 3.
  - code: prem-var-q2
    type: courte
    enonce: "Quel est le type de `3.5` en Python ?"
    reponses_acceptees: ["float"]
    explication: Les nombres à virgule sont de type float.
