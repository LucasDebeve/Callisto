framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port']

    # S4 : cookie de session Secure, HttpOnly, SameSite ; seul cookie de l'application (R2).
    session:
        name: callisto_session
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        cookie_lifetime: 0
        gc_maxlifetime: 7200

    http_method_override: false
    handle_all_throwables: true

    # S3 : limitation des essais de connexion par compte et par adresse IP.
    rate_limiter:
        login_per_ip:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        login_per_account:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        quiz_start:
            policy: token_bucket
            limit: 20
            rate: { interval: '1 minute', amount: 5 }

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
