# Services de DÉVELOPPEMENT uniquement : l'application tourne sur le poste (composer dev).
#   composer setup   # une fois : services, migrations, contenus, démonstration
#   composer dev     # serveur local sur http://127.0.0.1:8000
# La production utilise compose.prod.yaml (images de l'application et de Caddy).
name: callisto-dev

services:
  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: callisto
      POSTGRES_USER: callisto
      POSTGRES_PASSWORD: callisto
    # Publié sur la boucle locale seulement, pour l'application lancée sur le poste.
    # Port modifiable si un PostgreSQL local occupe déjà 5432 (adapter alors DATABASE_URL dans .env.local).
    ports:
      - "127.0.0.1:${CALLISTO_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "callisto", "-U", "callisto"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data:
